name: Windows installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: game
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 23

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows package
        shell: bash
        run: ./gradlew lwjgl3:packageWinX64

      - name: Unpack Windows package
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path lwjgl3/build -Recurse -Filter "*windows-x64*.zip" | Select-Object -First 1
          if (-not $zip) { throw "Windows zip not found under lwjgl3/build" }
          Write-Host "Found zip: $($zip.FullName)"
          if ($zip.Name -match '^FISHURAI-(.+)-windows-x64\.zip$') { $version = $Matches[1] } else { $version = "1.0.0" }
          Expand-Archive -Path $zip.FullName -DestinationPath unpacked -Force
          $exe = Get-ChildItem -Path unpacked -Recurse -Filter "*.exe" | Where-Object { $_.Name -ieq "fishurai.exe" } | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem -Path unpacked -Recurse -Filter "*.exe" | Select-Object -First 1 }
          if (-not $exe) { throw "No exe found in unpacked package" }
          Write-Host "Found exe: $($exe.FullName)"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_EXE=$($exe.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SOURCE_DIR=$($exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Convert PNG icon to ICO
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          $png = (Resolve-Path "lwjgl3/src/main/resources/libgdx128.png").Path
          $icoDir = Join-Path (Get-Location).Path "build-icon"
          New-Item -ItemType Directory -Force -Path $icoDir | Out-Null
          $ico = Join-Path $icoDir "logo.ico"
          python -c "from PIL import Image; import sys; Image.open(sys.argv[1]).convert('RGBA').save(sys.argv[2], format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128)])" $png $ico
          if (-not (Test-Path $ico)) { throw "ICO conversion failed" }
          "ICON_FILE=$ico" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:APP_VERSION" `
            "/DSourceDir=$env:SOURCE_DIR" `
            "/DAppExe=$env:APP_EXE" `
            "/DIconFile=$env:ICON_FILE" `
            "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: game/out/FISHURAI-*-windows-setup.exe

      - name: Attach installer to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: game/out/FISHURAI-*-windows-setup.exe